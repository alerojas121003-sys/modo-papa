<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modo Papá</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#16324f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#16253a;--mut:#6b7a8c;--honey:#f2b544;--navy:#16324f;--line:#e2e8ef;--med:#e4627a;--tra:#5b8def;--cel:#f2b544;--com:#7fb69e;--par:#a77fd1;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0e1824;--card:#16253a;--ink:#eef3f8;--mut:#8fa1b5;--line:#243750}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
main{padding:16px}h2{font-size:1.15rem;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:var(--navy);color:#fff;border:0;border-radius:24px;padding:26px 22px}
.hero .n{font-size:5.2rem;line-height:1;font-weight:800;color:var(--honey)}
.hero p{margin:6px 0 0;opacity:.9}
.mut{color:var(--mut);font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:4px 0 10px}
button{background:var(--honey);color:#16253a;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
button.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--tra);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:560px}nav button{flex:1;background:none;border-radius:0;padding:10px 0;font-size:.72rem;color:var(--mut);font-weight:600}
nav button span{display:block;font-size:1.35rem}nav button.on{color:var(--ink)}nav button.on span{transform:scale(1.15)}
.blk{border-left:5px solid var(--honey)}.blk.b2{border-color:var(--tra)}.blk.b3{border-color:var(--com)}.blk h3{margin:0 0 6px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .d{padding:8px 0;border-radius:10px;font-size:.9rem;cursor:pointer;min-height:44px}
.grid .d.t{background:var(--navy);color:#fff}.grid .d.s{outline:2px solid var(--honey)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev b{display:block}.ev.done b{text-decoration:line-through;opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
img.f{width:100%;border-radius:12px;margin-top:8px}
.err{color:var(--med);font-size:.9rem}
#login{padding:60px 22px;text-align:center}#login h1{font-size:2.2rem;margin:0 0 6px}
</style></head><body>
<div id="app"></div>
<script>
// ====== 1) PEGA AQUÍ TUS DATOS DE SUPABASE (Project Settings → API) ======
const SB_URL='https://wljnyadqllulqjtrhcpg.supabase.co/rest/v1/', SB_KEY='sb_publishable_ui3V2W9KX-AGV5lANwj6iQ_htJv9iA-';
// =========================================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5, pd=s=>new Date(s+'T12:00:00');
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy=()=>fmt(new Date());
const CAT={medico:['🩺 Médico','--med'],tramites:['📋 Trámites','--tra'],celebracion:['🎁 Celebración','--cel'],compras:['🛒 Compras','--com'],pareja:['💛 Pareja','--par']};
const TAM={4:'🌱 una semilla de amapola',6:'🫘 una lenteja',7:'🫐 un arándano',8:'🍇 una frambuesa',9:'🫒 una aceituna',10:'🍊 una mandarina chica',11:'🥭 un higo',12:'🍋 un limón',13:'🫛 una vaina de arveja',14:'🍑 un durazno',16:'🥑 un aguacate',18:'🫑 un pimiento',20:'🍌 un banano',24:'🌽 una mazorca',28:'🍆 una berenjena',32:'🥔 una jícama',36:'🥬 una lechuga grande',40:'🍉 una sandía chica'};
const SUG=[[8,'Primer control prenatal y análisis','medico'],[12,'Ecografía 1er trimestre','medico'],[20,'Ecografía morfológica','medico'],[26,'Prueba de tolerancia a la glucosa','medico'],[30,'Vacuna Tdap','medico'],[36,'Cultivo de estreptococo y preinscripción en hospital','tramites'],[37,'Maleta del hospital lista','compras'],[40,'Fecha probable de parto','celebracion']];
let U,cfg,tab='home',ev=[],di=[],lec=null,mes=new Date(),sel=hoy(),msg='';
const lmp=()=>new Date(pd(cfg.due_date)-280*DAY);
const gest=()=>{const t=Math.floor((pd(hoy())-lmp())/DAY);return{w:Math.floor(t/7),d:t%7}};
const tam=w=>TAM[Math.max(...Object.keys(TAM).filter(k=>k<=w))];

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  U=session.user;
  let {data:c}=await sb.from('config').select('*').eq('user_id',U.id).maybeSingle();
  if(!c){const r=await sb.from('config').insert({user_id:U.id,due_date:'2027-07-15',diary_start:'2026-11-12'}).select().single();c=r.data}
  cfg=c; await load(); render();
}
async function load(){
  const [e,d,l]=await Promise.all([
    sb.from('eventos').select('*').order('fecha'),
    sb.from('diario').select('*').eq('deleted',false).order('fecha',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('lecturas').select('*').eq('fecha',hoy()).maybeSingle()]);
  ev=e.data||[]; di=d.data||[]; lec=l.data;
  const paths=di.filter(x=>x.foto_path).map(x=>x.foto_path);
  if(paths.length){const {data}=await sb.storage.from('fotos').createSignedUrls(paths,3600);(data||[]).forEach(s=>{di.forEach(x=>{if(x.foto_path===s.path)x.url=s.signedUrl})})}
}
function loginView(step='email',email=''){
  app.innerHTML=`<div id="login"><div style="font-size:3rem">🍼</div><h1>Modo Papá</h1>
  <p class="mut">${step==='email'?'Escribe tu correo y te enviamos un código de 6 dígitos.':'Revisa tu correo y escribe el código.'}</p>
  ${step==='email'?`<input id="em" type="email" placeholder="tu@correo.com" autocomplete="email"><button id="go">Enviar código</button>`
  :`<input id="cd" inputmode="numeric" maxlength="8" placeholder="Código" autocomplete="one-time-code"><button id="go">Entrar</button>`}
  <p class="err" id="er"></p></div>`;
  $('#go').onclick=async()=>{
    if(step==='email'){const em=$('#em').value.trim();const {error}=await sb.auth.signInWithOtp({email:em});
      error?$('#er').textContent='No se pudo enviar: '+error.message:loginView('code',em)}
    else{const {error}=await sb.auth.verifyOtp({email,token:$('#cd').value.trim(),type:'email'});
      error?$('#er').textContent='Código incorrecto o vencido. Pide uno nuevo.':init()}};
}
function render(){
  const T=[['home','🏠','Inicio'],['lectura','📖','Hoy'],['cal','📅','Calendario'],['diario','📝','Diario'],['ajustes','⚙️','Ajustes']];
  app.innerHTML=`<main>${views[tab]()}</main><nav><div>${T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}" aria-label="${t[2]}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></nav>`;
  app.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';render()});
  (binds[tab]||(()=>{}))();
}
const views={
home(){
  const g=gest(),left=Math.ceil((pd(cfg.due_date)-pd(hoy()))/DAY);
  const nx=ev.filter(e=>e.fecha>=hoy()&&!e.completado)[0];
  return `<div class="card hero"><p>Semana ${g.w} · día ${g.d}</p><div class="n">${left}</div><p>días para conocerlo</p><p style="margin-top:14px">Tu bebé mide como ${tam(g.w)}</p></div>
  <div class="card"><b>Próximo evento</b><p class="mut" style="margin:6px 0 0">${nx?`${esc(nx.titulo)} · ${nx.fecha}`:'No tienes eventos próximos. Agrégalos en Calendario.'}</p></div>
  <button style="width:100%" onclick="tab='lectura';render()">Lectura de hoy</button>`},
lectura(){
  const b=(c,t,x)=>`<div class="card blk ${c}"><h3>${t}</h3><div>${esc(x)}</div></div>`;
  return `<h2>Lectura de hoy</h2>${lec?b('','💛 Cómo cuidarla hoy',lec.cuidar)+b('b2','🧠 Dato del embarazo',lec.dato)+b('b3','👶 Misión de papá',lec.mision)
  :`<div class="card"><p class="mut">La lectura se genera cada madrugada. Si aún no aparece, créala ahora.</p><button id="gen">Generar lectura</button><p class="err">${esc(msg)}</p></div>`}
  <p class="mut">Contenido orientativo. Ante sangrado, dolor fuerte o cualquier duda, llama al médico.</p>`},
cal(){
  const y=mes.getFullYear(),m=mes.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){const f=fmt(new Date(y,m,d)),es=ev.filter(e=>e.fecha===f);
    cells+=`<div class="d ${f===hoy()?'t':''} ${f===sel?'s':''}" data-d="${f}">${d}<br>${es.slice(0,3).map(e=>`<span class="dot" style="background:var(${CAT[e.categoria][1]})"></span>`).join('')}</div>`}
  const up=ev.filter(e=>e.fecha>=hoy()).slice(0,12);
  return `<h2 style="display:flex;justify-content:space-between"><button class="g" id="pm">‹</button>${mes.toLocaleDateString('es',{month:'long',year:'numeric'})}<button class="g" id="nm">›</button></h2>
  <div class="card"><div class="grid">${'DLMMJVS'.split('').map(x=>`<b class="mut">${x}</b>`).join('')}${cells}</div></div>
  <div class="card"><b>Nuevo evento</b><input id="et" placeholder="Ej. Ecografía con Dra. Rojas"><div class="row"><input id="ef" type="date" value="${sel}"><select id="ec">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div><textarea id="en" rows="2" placeholder="Notas: preguntas para el doctor, qué llevar"></textarea><button id="ea">Guardar evento</button></div>
  <h2>Próximos</h2><div class="card">${up.map(e=>{const dd=Math.ceil((pd(e.fecha)-pd(hoy()))/DAY);return `<div class="ev ${e.completado?'done':''}"><input type="checkbox" data-ck="${e.id}" ${e.completado?'checked':''} style="width:24px;margin:2px 0" aria-label="Completado"><div style="flex:1"><b>${esc(e.titulo)}</b><span class="mut">${e.fecha} · ${CAT[e.categoria][0]} · ${dd===0?'hoy':'en '+dd+' días'}</span>${e.notas?`<div class="mut">${esc(e.notas)}</div>`:''}</div><button class="g" data-del="${e.id}" aria-label="Borrar">✕</button></div>`}).join('')||'<p class="mut">Sin eventos próximos.</p>'}</div>
  <button class="g" id="sug" style="width:100%">Cargar citas sugeridas según tu fecha de parto</button>`},
diario(){
  return `<h2>Diario</h2><div class="card"><div class="row"><input id="df" type="date" value="${hoy()}"><select id="de">${['😊 Feliz','🥹 Emocionado','😰 Nervioso','😴 Cansado','💛 Agradecido'].map(x=>`<option>${x}</option>`).join('')}</select></div>
  <textarea id="dt" rows="4" placeholder="¿Qué pasó hoy? ¿Qué sentiste?"></textarea><input id="dp" type="file" accept="image/*"><button id="da">Guardar entrada</button><p class="err">${esc(msg)}</p></div>
  ${di.map(x=>`<div class="card"><div class="mut">${x.fecha} · ${esc(x.emocion)}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(x.texto)}</div>${x.url?`<img class="f" src="${x.url}" alt="Foto del diario">`:''}<button class="g" data-dd="${x.id}" style="margin-top:10px">Archivar</button></div>`).join('')||'<p class="mut">Tu primera entrada te espera.</p>'}`},
ajustes(){
  return `<h2>Ajustes</h2><div class="card"><b>Fecha probable de parto</b><input id="fp" type="date" value="${cfg.due_date}"><button id="fs">Guardar y recalcular</button><p class="mut">Si el médico la ajusta en la ecografía, cámbiala aquí.</p></div>
  <div class="card"><b>Respaldo</b><p class="mut">Descarga todo tu diario y calendario. Hazlo una vez al mes.</p><button id="ex">Exportar todo (JSON)</button></div>
  <div class="card"><p class="mut">${esc(U.email)}</p><button class="g" id="lo">Cerrar sesión</button></div>`}
};
const q=s=>document.querySelector(s);
const binds={
lectura(){const g=q('#gen');if(g)g.onclick=async()=>{g.disabled=true;g.textContent='Generando…';const {error}=await sb.functions.invoke('daily-reading');if(error)msg='No se pudo generar. Revisa que la función esté desplegada.';await load();render()}},
cal(){
  q('#pm').onclick=()=>{mes=new Date(mes.getFullYear(),mes.getMonth()-1,1);render()};
  q('#nm').onclick=()=>{mes=new Date(mes.getFullYear(),mes.getMonth()+1,1);render()};
  document.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{sel=c.dataset.d;render()});
  q('#ea').onclick=async()=>{const t=q('#et').value.trim();if(!t)return;
    await sb.from('eventos').insert({user_id:U.id,titulo:t,fecha:q('#ef').value,categoria:q('#ec').value,notas:q('#en').value});await load();render()};
  document.querySelectorAll('[data-ck]').forEach(c=>c.onchange=async()=>{await sb.from('eventos').update({completado:c.checked}).eq('id',c.dataset.ck);await load();render()});
  document.querySelectorAll('[data-del]').forEach(c=>c.onclick=async()=>{if(confirm('¿Borrar este evento?')){await sb.from('eventos').delete().eq('id',c.dataset.del);await load();render()}});
  q('#sug').onclick=async()=>{const have=new Set(ev.map(e=>e.titulo));
    const rows=SUG.filter(s=>!have.has(s[1])).map(s=>({user_id:U.id,titulo:s[1],fecha:fmt(new Date(+lmp()+s[0]*7*DAY)),categoria:s[2],notas:'Sugerido (orientativo, tu médico manda)'}));
    if(rows.length)await sb.from('eventos').insert(rows);await load();render()};
},
diario(){
  q('#da').onclick=async()=>{const t=q('#dt').value.trim(),f=q('#dp').files[0];if(!t&&!f){msg='Escribe algo o agrega una foto.';return render()}
    q('#da').disabled=true;q('#da').textContent='Guardando…';let path=null;
    if(f){const blob=await shrink(f);path=`${U.id}/${crypto.randomUUID()}.jpg`;
      const {error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});
      if(error){msg='No se pudo subir la foto: '+error.message;return render()}}
    const {error}=await sb.from('diario').insert({user_id:U.id,fecha:q('#df').value,texto:t,emocion:q('#de').value,foto_path:path});
    msg=error?'No se guardó: '+error.message:'';await load();render()};
  document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=async()=>{if(confirm('Se archiva, no se borra. Se puede recuperar desde Supabase.')){await sb.from('diario').update({deleted:true}).eq('id',b.dataset.dd);await load();render()}});
},
ajustes(){
  q('#fs').onclick=async()=>{const {data}=await sb.from('config').update({due_date:q('#fp').value}).eq('user_id',U.id).select().single();cfg=data;tab='home';render()};
  q('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
  q('#ex').onclick=async()=>{const [a,b,c]=await Promise.all([sb.from('diario').select('*'),sb.from('eventos').select('*'),sb.from('lecturas').select('*')]);
    const u=URL.createObjectURL(new Blob([JSON.stringify({config:cfg,diario:a.data,eventos:b.data,lecturas:c.data},null,2)],{type:'application/json'}));
    const l=document.createElement('a');l.href=u;l.download='modo-papa-respaldo-'+hoy()+'.json';l.click()};
}};
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.82)};im.src=URL.createObjectURL(file)})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script></body></html>
